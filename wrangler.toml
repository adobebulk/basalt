# Cloudflare Pages project config
# Used by `npx wrangler pages dev` for local dev and `wrangler pages deploy` for production.
#
# Production bindings (R2, IMAGES, secrets) are configured in the Pages project dashboard:
#   Pages → Settings → Functions → Bindings & Variables
# The entries below are for local dev only (wrangler pages dev).

name = "basalt"
compatibility_date = "2025-01-01"
pages_build_output_dir = "site/public"

[vars]
HUGO_VERSION = "0.161.1"
# Keep in sync with package.json version
PACKAGE_VERSION = "0.4.1"
GITHUB_REPO = "adobebulk/basalt"
ASSETS_R2_PUBLIC_URL = "https://r2.example.com"
PUBLIC_ORIGIN = "https://example.com"
# DEPLOY_HOOK_URL is a Pages secret — never a wrangler [vars] entry.

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "basalt-assets"

[[r2_buckets]]
binding = "ORIGINALS_BUCKET"
bucket_name = "basalt-originals"
