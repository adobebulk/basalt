<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>{{ partial "head.html" . }}</head>
<body class="min-h-screen flex flex-col bg-stone-50 text-stone-900 font-sans">
  {{ partial "header.html" . }}

  <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-bold tracking-tight leading-tight">{{ .Title }}</h1>
    <div class="mt-8 prose max-w-none text-sm leading-relaxed">
      {{ .Content }}
    </div>
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
